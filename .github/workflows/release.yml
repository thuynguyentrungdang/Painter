name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 2.0.2, must match ModMetadata.Version in Painter.cs)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Painter-4.0/Painter-4.0.sln

      - name: Build and package
        run: dotnet build Painter-4.0/Painter-4.0.sln -c Release /p:Version=${{ inputs.version }}

      - name: Create and push tag
        run: |
          git tag "${{ inputs.version }}"
          git push origin "${{ inputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.version }}" \
            "Painter-4.0/Painter-4.0/artifacts/Painter-4.0-${{ inputs.version }}.zip" \
            --title "${{ inputs.version }}" \
            --generate-notes
